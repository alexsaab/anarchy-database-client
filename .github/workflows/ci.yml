name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Typechecks, builds the extension bundle, builds the test bundles and
      # runs them. The bundle-integrity test needs the real build to exist.
      - run: npm test

      # A packaging failure should not wait until release day.
      - run: npx vsce package --no-dependencies --out /tmp/extension.vsix

      # Test bundles and sources once leaked into the package; keep it small.
      - name: Check package contents
        run: |
          size=$(stat -c%s /tmp/extension.vsix)
          echo "vsix size: $((size / 1024 / 1024)) MB"
          if [ "$size" -gt 10485760 ]; then
            echo "::error::vsix is larger than 10 MB; check .vscodeignore"
            unzip -l /tmp/extension.vsix | sort -k1 -n -r | head -20
            exit 1
          fi
          if unzip -l /tmp/extension.vsix | grep -E "out-test/|transcript_full|CHAT_HISTORY|extension/src/"; then
            echo "::error::the package contains files that should be ignored"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: /tmp/extension.vsix
